# Render Blueprint: one web service (API + built frontend) and a Postgres database.
# Deploy from the Render dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: safargo
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build && npm --prefix backend ci --omit=dev
    # db:init is safe to re-run (IF NOT EXISTS everywhere), so the schema is
    # always up to date before the server starts.
    startCommand: npm --prefix backend run db:init && npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safargo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set to this service's own URL, e.g. https://safargo.onrender.com
      - key: FRONTEND_URL
        sync: false
      # Read by the frontend build: shown in the header and WhatsApp button
      - key: VITE_CONTACT_PHONE
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: safargo-db
    plan: free
    databaseName: safargo
    user: safargo
