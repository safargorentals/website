# Render Blueprint: the API web service (free plan).
# The website itself is hosted on Netlify (see frontend/netlify.toml).
# The database is Neon's free Postgres (neon.tech), which does not expire;
# Render's free database is deleted after 30 days, so it is not used.
# Free web services sleep after 15 minutes without traffic: a free uptime
# monitor (e.g. UptimeRobot) calling /api/health every 5 minutes keeps it
# awake, within Render's 750 free hours a month. /api/health does not touch
# the database, so the pings do not use Neon's free compute hours.
# Deploy from the Render dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: safargo
    runtime: node
    plan: free
    buildCommand: npm run build
    # db:init is safe to re-run (IF NOT EXISTS everywhere), so the schema is
    # always up to date before the server starts.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon connection string (ends in ?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The Netlify site's URL, e.g. https://safargo.netlify.app
      - key: FRONTEND_URL
        sync: false
      # Netlify proxy + Render proxy in front of the app
      - key: TRUST_PROXY_HOPS
        value: "2"
      # Same value as API_SIGNATURE_TOKEN on Netlify; when set, the API only
      # answers requests signed by the Netlify proxy (see netlify.toml)
      - key: NETLIFY_PROXY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
