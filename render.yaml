# Render Blueprint: the API web service and a Postgres database.
# The website itself is hosted on Netlify (see frontend/netlify.toml).
# Deploy from the Render dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: safargo
    runtime: node
    plan: free
    buildCommand: npm run build
    # db:init is safe to re-run (IF NOT EXISTS everywhere), so the schema is
    # always up to date before the server starts.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safargo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # The Netlify site's URL, e.g. https://safargo.netlify.app
      - key: FRONTEND_URL
        sync: false
      # Netlify proxy + Render proxy in front of the app
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: safargo-db
    plan: free
    databaseName: safargo
    user: safargo
