# Netlify settings for the Drive Kochi frontend.
# In Netlify set "Base directory" to: frontend

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Site address for canonical URLs, link previews and the sitemap
  # (scripts/prerender.js)
  SITE_URL = "https://drivekochi.in"

# Redirects (incl. the /api proxy to Render) and security headers live in
# public/_redirects and public/_headers, so they end up inside dist/ and also
# work for drag-and-drop deploys, which ignore this file.
#
# To lock the Render API to this site only (Netlify signs every proxied
# request): that needs a netlify.toml redirect with
#   signed = "API_SIGNATURE_TOKEN"
# and a Git-connected build; _redirects can't sign requests.
