# Netlify settings for the Drive Kochi frontend.
# In Netlify set "Base directory" to: frontend

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Forward API calls to the Render backend. The browser only ever talks to
# Netlify, so the admin login cookie stays same-site.
# The Render web service (API only).
[[redirects]]
  from = "/api/*"
  to = "https://safargorentals.onrender.com/api/:splat"
  status = 200
  force = true
  # To lock the Render API to this site only: add the env var
  # API_SIGNATURE_TOKEN (a long random secret) in Netlify, set the SAME value
  # as NETLIFY_PROXY_SECRET on Render, then uncomment this line. Netlify then
  # signs every proxied request and the API refuses unsigned ones.
  # signed = "API_SIGNATURE_TOKEN"

# Single-page app: every other path loads index.html and React Router
# shows the right page (/admin, /admin/dashboard, ...).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every page.
# Content-Security-Policy: scripts only from this site, plus the one inline
# script in index.html (allowed by its hash - if you edit that script, update
# the hash: sha256 of its exact text, base64). Fonts from Google Fonts,
# images from anywhere over https (car photos), API calls only to this site.
# frame-ancestors 'none' + X-Frame-Options stop other sites framing the
# pages (clickjacking).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-NRVOQup4X13QuKbcQW8mifjkZR5Wzi+SPFpN2W2pw64='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Admin pages: never cached, never indexed by search engines
[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Built assets have content hashes in their names, so they can be cached
# for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
